# =====================================
# MySQL StatefulSet
# =====================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: "mysql"
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_DATABASE
              value: "kumeong_store"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
---
# =====================================
# MySQL Service
# =====================================
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# =====================================
# Backend Deployment
# =====================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kumeong-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kumeong-api
  template:
    metadata:
      labels:
        app: kumeong-api
    spec:
      containers:
        - name: api
          image: gegujin/kumeong-api:0.4.0
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "root"
            - name: DB_DATABASE
              value: "kumeong_store"
            - name: API_PREFIX
              value: "/api"
            - name: API_VERSION
              value: "1"
---
# =====================================
# Backend Service
# =====================================
apiVersion: v1
kind: Service
metadata:
  name: kumeong-api
spec:
  selector:
    app: kumeong-api
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
# =====================================
# Frontend Deployment
# =====================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kumeong-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kumeong-front
  template:
    metadata:
      labels:
        app: kumeong-front
    spec:
      containers:
        - name: front
          image: gegujin/kumeong-front:0.4.0
          ports:
            - containerPort: 80
---
# =====================================
# Frontend Service (LoadBalancer)
# =====================================
apiVersion: v1
kind: Service
metadata:
  name: kumeong-front
spec:
  selector:
    app: kumeong-front
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
