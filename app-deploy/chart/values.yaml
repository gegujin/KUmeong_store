# -------------------------
# Global Values
# -------------------------
namespace: default

# -------------------------
# Backend API Settings
# -------------------------
backend:
  image:
    repository: gegujin/kumeong-api
    tag: "0.4.1"
    pullPolicy: IfNotPresent

  replicaCount: 1
  port: 3000

  env:
    NODE_ENV: "production"
    API_PREFIX: "/api"
    API_VERSION: "1"

    DB_HOST: "mysql"
    DB_PORT: "3306"
    DB_USERNAME: "root"
    DB_PASSWORD: "root"
    DB_DATABASE: "kumeong_store"

    # 🔥 필수값
    CORS_ORIGIN: "*"
    JWT_ACCESS_SECRET: "kumeong_access_secret"
    JWT_REFRESH_SECRET: "kumeong_refresh_secret"

  ingress:
    enabled: false
    className: ""
    host: "api.example.com"
    path: /
    tls: false

# -------------------------
# Frontend Settings
# -------------------------
frontend:
  image:
    repository: gegujin/kumeong-front
    tag: "0.4.0"
    pullPolicy: IfNotPresent

  replicaCount: 1
  port: 80

  ingress:
    enabled: false
    className: ""
    host: "front.example.com"
    path: /
    tls: false

# -------------------------
# MySQL Settings
# -------------------------
mysql:
  enabled: true
  image: "mysql:8"
  port: 3306

  rootPassword: "jin20503*"
  database: "kumeong_store"

  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""

# -------------------------
# Monitoring Settings
# -------------------------
monitoring:
  prometheus:
    enabled: false
