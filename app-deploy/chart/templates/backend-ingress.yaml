{{- if .Values.backend.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kumeong-api-ingress
spec:
  ingressClassName: {{ .Values.backend.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kumeong-api
                port:
                  number: {{ .Values.backend.port }}
{{- end }}
