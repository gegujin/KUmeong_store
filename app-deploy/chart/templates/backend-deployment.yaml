apiVersion: apps/v1
kind: Deployment
metadata:
  name: kumeong-api
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: kumeong-api
  template:
    metadata:
      labels:
        app: kumeong-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.backend.port }}

          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}

          # 업로드 폴더 PVC 마운트
          volumeMounts:
            - name: uploads
              mountPath: /usr/src/app/uploads

          # 리소스 요청/제한
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"

          # ✔ Swagger JSON 기반 헬스체크
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 40
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 20
            periodSeconds: 5

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
